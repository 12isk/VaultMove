name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import vaultmove; print(vaultmove.__version__)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VaultMove $v"

      - name: Compile translations (.ts -> .qm)
        run: pyside6-lrelease vaultmove/app/i18n/vaultmove_fr.ts -qm vaultmove/app/i18n/vaultmove_fr.qm

      - name: Render icon (.ico)
        run: python packaging/make_icon.py

      - name: Tests (invariants, crash injection, faults, e2e, VSS protocol, UI smoke + screenshots)
        env:
          QT_QPA_PLATFORM: offscreen
          VAULTMOVE_SCREENSHOTS: ${{ github.workspace }}\screenshots
          VAULTMOVE_REAL_RECYCLE: "1"
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Performance test (200,000 files, incremental scan < 60 s)
        env:
          VAULTMOVE_PERF: "1"
        run: python -m pytest -v -s tests/test_perf.py --basetemp=.pytest-perf

      - name: PyInstaller - installer payload (onedir)
        run: pyinstaller --noconfirm --clean packaging/vaultmove.spec

      - name: PyInstaller - portable (onefile)
        env:
          VAULTMOVE_ONEFILE: "1"
        run: pyinstaller --noconfirm packaging/vaultmove.spec

      - name: Self-test the frozen executables
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          foreach ($exe in @("dist\VaultMove\VaultMove.exe", "dist\VaultMove-Portable-$ver.exe")) {
            $out = Join-Path $env:RUNNER_TEMP ("selftest-" + [IO.Path]::GetFileNameWithoutExtension($exe) + ".txt")
            $p = Start-Process -FilePath $exe -ArgumentList @("--selftest", $out) -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$exe self-test timed out" }
            Get-Content $out
            if (-not (Select-String -Path $out -Pattern "RESULT OK" -Quiet)) { throw "$exe self-test failed" }
          }

      - name: Code signing of the executables (only if a certificate secret is set)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/sign.ps1 "dist\VaultMove\VaultMove.exe" "dist\VaultMove-Portable-${{ steps.ver.outputs.version }}.exe"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Code signing of the installer (only if a certificate secret is set)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/sign.ps1 "dist\VaultMove-Setup-${{ steps.ver.outputs.version }}.exe"

      - name: Size report
        shell: pwsh
        run: python packaging/size_report.py | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VaultMove-Setup-${{ steps.ver.outputs.version }}
          path: dist/VaultMove-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: VaultMove-Portable-${{ steps.ver.outputs.version }}
          path: dist/VaultMove-Portable-*.exe
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
